[workspace]
resolver = "2"
members = [
  "crates/impetus-ext-support",
  "crates/impetus-ext-mcp",
  "extensions/browser",
  "extensions/lsp",
  "extensions/git-tools",
  "extensions/code-search",
  "extensions/http-fetch",
]
default-members = [
  "crates/impetus-ext-support",
  "crates/impetus-ext-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["Impetus Contributors"]
repository = "https://github.com/1tuz/impetus-extensions"
homepage = "https://github.com/1tuz/impetus-extensions"

[workspace.dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time", "fs"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
clap = { version = "4.5.48", features = ["derive"] }
tempfile = "3.23.0"
regex = "1.11.3"
url = "2.5.7"
hex = "0.4.3"
walkdir = "2.5.0"
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls", "json"] }

impetus-ext-support = { path = "crates/impetus-ext-support" }
impetus-ext-mcp = { path = "crates/impetus-ext-mcp" }

[profile.release]
lto = true
codegen-units = 1
strip = true
