id = "code-search"
version = "0.1.0"
kind = "mcp_config"
display_name = "Code Search"
description = "Workspace-sandboxed text search via ripgrep, with a walk+regex fallback."
permissions = ["filesystem.read"]
permission_rationale = [
  { permission = "filesystem.read", reason = "Read files under the configured workspace root only. Paths are canonicalized and rejected if they escape the root (including via symlinks)." },
]

[compatibility]
extension_api_version = "0.1.0-skill-mcp"
impetus_tag = "v0.1.2"
extension_schema = "impetus.extension.v1@1"
mcp_schema = "impetus.mcp.v1@1"

[entrypoints]
mcp_json = "mcp.json"
binary = "impetus-ext-code-search"
