[package]
name = "impetus-ext-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generic LSP MCP extension for Impetus"
repository.workspace = true
readme = "README.md"

[[bin]]
name = "impetus-ext-lsp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait = "0.1.89"
clap.workspace = true
impetus-ext-mcp.workspace = true
