id = "git-tools"
version = "0.1.0"
kind = "mcp_config"
display_name = "Git Tools"
description = "Read-only git inspection over MCP: status, diff, log, and show."
permissions = ["process"]
permission_rationale = [
  { permission = "process", reason = "Spawn only the git binary with an allowlisted set of read-only subcommands (status/diff/log/show). Never shell -c; no commit, push, or force." },
]

[compatibility]
extension_api_version = "0.1.0-skill-mcp"
impetus_tag = "v0.1.2"
extension_schema = "impetus.extension.v1@1"
mcp_schema = "impetus.mcp.v1@1"

[entrypoints]
mcp_json = "mcp.json"
binary = "impetus-ext-git-tools"
