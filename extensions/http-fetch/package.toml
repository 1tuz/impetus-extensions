id = "http-fetch"
version = "0.1.0"
kind = "mcp_config"
display_name = "HTTP Fetch"
description = "HTTP GET/HEAD/POST over MCP with scheme allowlist, size/timeout limits, and localhost-redirect blocking."
permissions = ["network"]
permission_rationale = [
  { permission = "network", reason = "Outbound HTTP(S) only. No filesystem or process permissions. file:// blocked; redirects to localhost blocked unless allow_localhost_redirects=true (default off)." },
]

[compatibility]
extension_api_version = "0.1.0-skill-mcp"
impetus_tag = "v0.1.2"
extension_schema = "impetus.extension.v1@1"
mcp_schema = "impetus.mcp.v1@1"

[entrypoints]
mcp_json = "mcp.json"
binary = "impetus-ext-http-fetch"
